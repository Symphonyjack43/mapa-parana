<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa cultural de Paraná</title>

    <!-- 1. "Plugin" Leaflet: Cargamos su CSS base y su Script -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Aquí conectamos el CSS (Tu UI Theme) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Este es tu nodo raíz visible. Aquí dentro pondremos el Control node para nuestro mapa -->

    <!-- Tu "CanvasLayer" para la UI de filtros -->
    <div id="ui-filtros">
        <h3 class="titulo-filtro">Categorías</h3>
        <!-- Etiquetas que funcionan como un CheckBox en Godot -->
        <label><input type="checkbox" id="check-feria" value="feria" checked> Ferias</label><br>
        <label><input type="checkbox" id="check-charla" value="charla" checked> Charlas</label>
    </div>

    <!-- 2. Tu nodo contenedor. El atributo "id" es como renombrar el nodo en el árbol para buscarlo luego por código -->
    <div id="mapa-contenedor"></div>

    <!-- Aquí conectamos el JavaScript (Tu GDScript principal) -->
    <script src="main.js"></script>
</body>
</html>
